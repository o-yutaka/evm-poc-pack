name: Elastic Agent Builder allowedHosts repro

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elastic-repro
  cancel-in-progress: false

jobs:
  repro:
    name: ES/Kibana 9.5.5 allowedHosts matrix
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: elastic-repro
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Runner info
        run: |
          docker compose version
          docker version --format '{{.Server.Version}}'
          echo "CPUs: $(nproc)"; free -h; df -h .
      - name: Kernel setting for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Generate throwaway lab credentials (.env, runner-local only)
        run: |
          umask 077
          {
            echo "ELASTIC_PASSWORD=$(openssl rand -hex 16)"
            echo "KIBANA_SYSTEM_PASSWORD=$(openssl rand -hex 16)"
            echo "AB_USER=ab_tester"
            echo "AB_PASSWORD=$(openssl rand -hex 16)"
            echo "ESO_ENCRYPTION_KEY=$(openssl rand -hex 32)"
          } > .env
          echo ".env generated (values are per-run, never committed, discarded with the runner)"
      - name: Run the repro matrix (stack up, controls, tests, evidence)
        timeout-minutes: 100
        run: bash run-test.sh 2>&1 | tee ci-run.log
      - name: Publish verdict to the run summary
        if: always()
        run: |
          EV="$(ls -dt evidence/*/ 2>/dev/null | head -1 || true)"
          {
            echo "## Elastic Agent Builder allowedHosts repro — verdict"
            echo
            if [ -n "$EV" ] && [ -f "$EV/SUMMARY.txt" ]; then
              echo '```'
              cat "$EV/SUMMARY.txt"
              echo '```'
              echo
              echo "Full evidence: download the elastic-repro-evidence artifact from this run."
            else
              echo "VERDICT: INCONCLUSIVE — run-test.sh produced no SUMMARY.txt. See ci-run.log and the artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "EVIDENCE_DIR=$EV" >> "$GITHUB_ENV"
      - name: Dump full compose logs (fallback evidence)
        if: always()
        run: |
          docker compose ps > ci-compose-logs.txt 2>&1 || true
          docker compose logs --no-color >> ci-compose-logs.txt 2>&1 || true
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elastic-repro-evidence-${{ github.run_id }}
          path: |
            elastic-repro/evidence/
            elastic-repro/ci-run.log
            elastic-repro/ci-compose-logs.txt
          if-no-files-found: warn
          retention-days: 90
      - name: Teardown stack
        if: always()
        run: docker compose down -v || true
      - name: Verdict gate (green only when CONFIRMED)
        if: always()
        run: |
          EV="$(ls -dt evidence/*/ 2>/dev/null | head -1 || true)"
          if [ -n "$EV" ] && grep -q "VERDICT: CONFIRMED" "$EV/SUMMARY.txt"; then
            echo "VERDICT: CONFIRMED"
            exit 0
          fi
          echo "Not confirmed (KILLED or INCONCLUSIVE)."
          exit 1
